name: Historical source verification

on:
  # Current development and automated gates live in Mvgnu/MCP-Host.
  # This explicit dispatch only verifies the retained source snapshot.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  verify:
    name: Historical contracts, Rust, console, and real-process journeys
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy,rustfmt
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config openssl
      - name: Install locked console dependencies
        run: cd ui && bun install --frozen-lockfile
      - name: Run one complete integration gate
        run: ./scripts/domain_check.sh all
