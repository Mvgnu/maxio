name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy,rustfmt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config openssl
      - run: cd ui && bun install --frozen-lockfile
      - run: ./scripts/domain_check.sh all

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: maxio-linux-amd64
          - runner: ubuntu-24.04-arm
            artifact: maxio-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config openssl
      - run: cd ui && bun install --frozen-lockfile && bun run build
      - run: cargo build --locked --release --bins
      - name: Package both executables
        run: tar -czf '${{ matrix.artifact }}.tar.gz' -C target/release maxio maxio-sync
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  image:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve this fork's image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          test "${RELEASE_TAG}" != "${RELEASE_TAG#v}"
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest

  release:
    needs: [build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: maxio-linux-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: '*.tar.gz'
